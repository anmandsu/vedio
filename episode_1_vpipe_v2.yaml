  - shot_id: "E1_S42"
    scene_id: "SC15_MONSTER_DISSOLUTION"
    character: "Ahmose"
    location: "EXT. PYRAMID - CONTINUOUS"

    plot: >
      Ahmose 意识到救他们的不是普通士兵，提出全集核心悬念：Khensu 究竟是谁。

    performance: >
      Ahmose 望向尘云中的石坑方向，眼中有敬畏、困惑和本能的追寻。他迈出一步，像被答案牵引。

    lighting: >
      夕近感的暖金光穿过尘埃，照出 Ahmose 眼中重新出现的高光。背景尘云内有微弱太阳涡旋光。

    camera: >
      景别 close；角度 eye_level；运镜 slow_push_in_on_Ahmose_then_rack_focus_to_crater；焦段 70mm。

    blocking: >
      Ahmose 在前景，身后怪物沙粒落尽；焦点从他的眼睛转到远处尘雾中的 Khensu 方向。

    sound: >
      战场静下来，只剩风穿过碎石。远处传来光鞭落地的轻响，引导 Ahmose 转头。

    dialogue: >
      AHMOSE（低声，自言自语，敬畏）：“Who... what are you?”

    duration_sec: 5
    beat_type: "mystery"

    style_notes: >
      台词里的停顿很重要：“Who”是人，“what”是神性疑问。

  - shot_id: "E1_S43"
    scene_id: "SC16_CLIFFHANGER"
    character: "Khensu"
    location: "EXT. PYRAMID CRATER - CONTINUOUS"

    plot: >
      Ahmose 奔向救命恩人，观众第一次看到战斗后的 Khensu：他放下光鞭，背后太阳形成盲目漩涡，开启下一集悬念。

    performance: >
      Khensu 站在尘云中，疲惫到几乎站不稳。他松开手，光鞭落下，脸上不是胜利，而是被某种力量召回前的恍惚。

    lighting: >
      太阳在他背后爆成强烈逆光，金色光环旋转成漩涡。人物正面几乎成剪影，只保留手臂金线和汗光。

    camera: >
      景别 close_up_on_whip_drop_then_medium_silhouette；角度 low_angle；运镜 tilt_up_from_falling_whip_to_Khensu；焦段 50mm。

    blocking: >
      前景是太阳鞭落到沙地，光芒慢慢熄灭；中景 Khensu 背对太阳；背景金色漩涡扩大，Ahmose 的奔跑身影在远处虚焦。

    sound: >
      光鞭落地发出沉重但柔和的金属火焰声，随后所有战场声被漩涡的高频太阳共鸣吸走。最后留下强烈风压。

    dialogue: >
      无对白。让 Ahmose 的远处脚步声和即将出口的呼喊被漩涡声吞没。

    duration_sec: 7
    beat_type: "cliffhanger"

    style_notes: >
      结尾必须是强视觉钩子：Khensu 像被太阳本身选中或带走。不要在本集解释漩涡，只留下敬畏和疑问。
