    plot: >
      Ahmose 站在尘埃中，看见 Isfet Spawn 失去力量并化成沙，确认胜利但保留神秘。

    performance: >
      Ahmose 缓慢站起，剑仍在颤抖。他看向怪物时没有胜利狂喜，只有震惊和劫后余生。

    lighting: >
      沙尘逐渐变薄，太阳重新照到金字塔。怪物化沙时，黑壳被金光剥落成灰黑砂粒。

    camera: >
      景别 medium_on_Ahmose_to_wide_reveal；角度 eye_level；运镜 slow_pull_back；焦段 50mm。

    blocking: >
      Ahmose 站在前景偏左，背景怪物庞大身躯开始塌陷。幸存士兵散落在更远处，不敢靠近。

    sound: >
      怪物身体崩解像干砂从巨型陶罐中倾泻，战场声逐渐空旷。风声重新成为主声源。

    dialogue: >
