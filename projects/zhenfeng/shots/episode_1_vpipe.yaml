# 《针锋·针心》VPipe v2 — AI-Native Shot Plan
# 导演: 是枝裕和体系 | 摄影: 山崎裕/泷本干也体系 | 美术: 被住过的空间 | 声音: 环境声驱动
# AI边界: 固定机位优势 / 5秒模块 / 交叉剪辑单人 / 物体替代表情 / 手-物交互规避
# 物质世界: 成都蜀绣绣坊（非日本）

episode: 1
title: "针锋·针心"
style: >
  成都老街蜀绣绣坊。是枝裕和式静态凝视×AI视频生成边界。
  木褐+墙白+丝线艳三色体系。自然光驱动叙事(冷灰→暖黄→冷蓝→天光→暖金)。
  针线声为心率,拆迁声为对抗。不特写泪脸,不三人同框,不推近拍情绪,
  不用配乐推情感。固定机位+5秒模块+交叉剪辑。负向标配: no theatricality, naturalistic stillness.

shots:
  # ============================================================
  # Episode 1: 《拆牌倒计时》
  # ============================================================

  # --- 场1: 清晨·失手 (5镜) ---
  - shot_id: "E1_S01"
    scene_id: "SC01_WORKSHOP_DAWN"
    character: "林素琴"
    location: "INT. 老绣坊 - 清晨"
    plot: "针稳入布→远处拆迁闷响→手停,摸耳垂→落针歪了——第一次失手"
    performance: >
      林素琴坐绣架前,背挺直,手指精准。全程无面部特写——手+针+耳垂是表演主体。
      针歪时:手指微滞,不是震惊,是"发生了什么"的瞬间空白。摸耳垂是下意识。
    lighting: >
      左窗东向晨光~5500K冷灰。自然散射,不加补光。暗部自然隐入阴影。
      针尖冷光反射。丝线在灰色空气中微发光——空间唯一"活"的色彩。
    camera: >
      镜1: 极近特写 针入布+丝线拉紧 (微距,40cm物距,焦点在绣布而非手指)
      镜2: 中景 林素琴坐姿 (50mm,固定,机高~90cm坐姿眼平,绣架左侧遮挡构图)
      镜3: 极近特写 针悬半空+手停 (微距,同镜1机位)
      镜4: 特写 手摸耳垂 (50mm)
      镜5: 极近特写 针歪落 (微距,焦点在歪针,不在手)
      全场固定,不推不摇。
    blocking: >
      前景:绣架张力杆+垂丝线(遮挡)。中景:林素琴+绣架+手。
      背景:左窗冷灰天光,木牌"蜀绣"居中,北墙丝线架色块。
    sound: >
      针入布:"沙"——极近极微。丝线拉紧:微"呲"。远处拆迁闷响(首次出现)。
      歪针时:丝线摩擦声变调(手停了)。全镜:绣坊环境底噪(丝绸微响,竹架嘎吱)。
      无音乐。声桥入:黑屏时先出1秒环境底噪再切画面。
    dialogue: "无对白"
    duration_sec: 15
    beat_type: "establishing"
    style_notes: >
      全片第一镜——建立"针=主角"的视觉契约。不拍脸。物件替代表演。
      AI手-物交互规避: 极近特写焦点落在绣布/针尖,手指作模糊前景入画。
    continuity_from: "— 全片第一镜"
    continuity_to: "E1_S02: 绣架位置/木牌位置/坐姿一致。光线后续从冷灰变暖金。"
    visual_anchors:
      - "lin-suqin: 56岁/深色对襟衫/盘发/耳垂小洞/手指有茧"
      - "embroidery-workshop: 绣架中央偏左/左窗/木牌后墙/丝线架北墙"
      - "needle: 刺绣针/针插"
    ai_notes: >
      AI优势区: 单人静态+固定机位+微距。手-物交互规避: 焦点在针尖,手指模糊前景。
      提示关键: "one stitch slightly misaligned, breaking uniform pattern"
    negative_prompt: >
      榻榻米,日式房间,和服,障子。旗袍,首饰,浓妆。崭新绣架。微笑。手持晃动。配乐。
      theatricality, exaggerated expressions, crying face, wide eyes.

  # --- 场2a: 傍晚·绣儿冲入 (3镜) ---
  - shot_id: "E1_S02"
    scene_id: "SC02_WORKSHOP_DUSK_A"
    character: "绣儿, 林素琴, 孩子"
    location: "INT. 老绣坊 - 傍晚"
    plot: "墙上红色拆牌通知。绣儿抱孩子冲入,手机拍桌上。林素琴头也不抬:'蜀绣是针,不是你手机里的东西。'"
    performance: >
      绣儿:动作快——冲门→拍手机。压情绪,不吼。林素琴:头不抬,继续绣——这是"不屑",不是"忙"。
    lighting: >
      右窗夕阳光~3200K暖金。拆牌通知被夕阳光打亮"明日执行"。绣儿背对窗口(暗部)。
      光比1:3,暗部不补光。
    camera: >
      镜1: 空镜 拆牌通知特写 (50mm,固定) ——AI空镜优势
      镜2: 单人 绣儿抱孩子冲入 (35mm,门口固定,门框作遮挡构图)
      镜3: 单人 林素琴侧脸,不抬头 (50mm,绣架后固定,透过绣布边缘拍)
      全场固定,不跟动作移动。无三人同框。
    blocking: >
      镜2: 门方向,绣儿从右入画。镜3: 绣架左后侧,林素琴侧脸,手机拍在绣架旁桌上(画外)。
    sound: >
      门推开:老木门合页金属声。绣儿脚步声(运动鞋在青砖地)。
      手机拍桌:"啪"木+玻璃。林素琴针线声持续——没停。窗外拆迁声(比场1近)。
      无音乐。
    dialogue: >
      绣儿(压情绪):"妈！最后一天了！明天房东就拆牌了！我能让蜀绣火！你让我拍！"
      林素琴(头不抬):"蜀绣是针。不是你手机里的东西。"
    duration_sec: 12
    beat_type: "escalation"
    style_notes: >
      "快"vs"慢"的节奏冲突。绣儿动作快,林素琴不动。拆牌通知的红=外部压力的侵入。
      AI: 单人镜头交叉剪辑,规避二人同框风险。
    continuity_from: "E1_S01: 绣架/木牌/坐姿一致。光从冷灰→暖金(时间推进)。"
    continuity_to: "E1_S03: 小伟入场,三人冲突升级。"
    visual_anchors:
      - "xiuer: 牛仔裤+浅外套/抱孩子/动作快"
      - "lin-suqin: 深色对襟衫/头不抬/针不停"
    ai_notes: "AI优势: 单人静态+空镜。规避: 不拍二人同框。手机屏幕内容后期合成(避免乱码)。"
    negative_prompt: "绣儿吼叫。林素琴抬头。三人广角同框。日式门。配乐。"

  # --- 场2b: 傍晚·小伟入场+冲突爆发 (5镜) ---
  - shot_id: "E1_S03"
    scene_id: "SC02_WORKSHOP_DUSK_B"
    character: "林素琴, 绣儿, 小伟, 孩子"
    location: "INT. 老绣坊 - 傍晚"
    plot: >
      小伟抱电脑入:'妈……我用AIGC做视觉还原。'林素琴停针,拍桌,针扎穿绣布。
      'AI是死的。人,是活的。'绣儿爆发指向木牌。巴掌。林素琴:'滚。别碰这块牌。'
    performance: >
      小伟:轻声,克制。林素琴:停针→缓缓抬头→拍桌(不是暴怒,是"被冒犯到极点")。
      站起来一步一步走——极慢,每一步在压制。绣儿:指向木牌是全片唯一允许外放的一句——之后被打。
      打完后:林素琴手在颤。绣儿愣住(不捂脸哭)。孩子哭了。
    lighting: >
      同场2a~3200K夕阳光继续褪去。巴掌瞬间光比增强(天色暗,无补光)。
      林素琴站起来→脸从暖光移入阴影(背对窗)。绣儿退入暗处——暖光不照她了。
    camera: >
      镜1: 单人 小伟抱电脑入 (35mm,门口固定)
      镜2: 极近特写 针停→手拍桌→针穿透绣布 (微距,焦点在针,拍结果不拍过程)
      镜3: 单人 林素琴站起,缓步向前 (50mm,绣架后固定,人从坐→站纵向移动)
      镜4: 单人 绣儿爆发"你守不住人"→指向木牌 (50mm,固定)——唯一允许外放镜头
      镜5: 巴掌后——声音+切黑(0.5s)→婴儿哭泣脸(中景)→林素琴手在颤(特写)→
            林素琴背对镜头走向深处,摸耳垂(中景,不切回脸)→低声"滚"
      全场固定。巴掌不实拍:声音+切黑+婴儿反应+手抖替代。不推近。
    blocking: >
      镜3: 林素琴从坐→站(画面下部→中部)。镜4: 绣儿单人,手指向画外(木牌方向)。
      镜5: 绣儿退后(被动),小伟微动未介入。木牌在全段作背景锚点。
    sound: >
      拍桌:"砰"木桌沉闷。针扎穿布:微"嘶"。椅子刮擦青砖地。巴掌:"啪"清脆。
      之后:孩子哭声+所有声音"变远"(混响拉宽)。"滚"极低,被窗外拆迁声微微覆盖(SR2)。
      沉默3秒——只有孩子哭声渐远+拆迁闷响(SR1+SR5)。无音乐。
    dialogue: >
      小伟(克制):"妈……我用AIGC做视觉还原,不碰您的手工……"
      林素琴(冷):"AI？AI是死的。人,是活的。"
      林素琴:"蜀绣一百三十二种针法……它学得会'力道'吗？"
      绣儿(爆发):"你守得住针——你守不住人！外婆留下的是活的手艺！不是陪你一起死的东西！"
      [巴掌]
      林素琴(极低):"滚。别碰这块牌。"
    duration_sec: 35
    beat_type: "disaster"
    style_notes: >
      全片第一情感高峰。是枝裕和式:不喊叫(除绣儿一句)/不推近/不加音乐。
      巴掌不实拍(AI最弱的手-脸接触)→声音+切黑+婴儿脸+手抖四段替代。
      全程交叉剪辑单人镜头,无三人广角同框。木牌是空间"道德中心"。
    continuity_from: "E1_S02: 位置延续。手机还在桌上。"
    continuity_to: "E1_S04: 同一空间只剩林素琴。光变冷蓝夜光。"
    visual_anchors:
      - "lin-suqin: 拍桌后摸耳垂/手颤/背对镜头"
      - "xiuer: 右脸被打位置→场4红印锚点"
      - "xiaowei: 卫衣+眼镜+电脑包/站中间/轻声"
      - "wooden-sign: 木牌居中/冲突焦点"
    ai_notes: >
      全片AI最高风险。巴掌绝对不直接生成。手抖拍结果(特写手)。婴儿哭简单表情可处理。
      交叉剪辑单人规避多人同框混乱。标准负向必加。
    negative_prompt: >
      三人同框,广角。巴掌实拍画面。任何人喊叫(绣儿那句除外)。晃动镜头。特写泪脸。配乐。
      theatricality, exaggerated mouth movements, furrowed brows, crying face close-up.

  # --- 场3: 夜·独坐 (3镜) ---
  - shot_id: "E1_S04"
    scene_id: "SC03_WORKSHOP_NIGHT"
    character: "林素琴"
    location: "INT. 老绣坊 - 夜"
    plot: "无灯。窗外冷光。林素琴独坐,看木牌。拿起针,手停住。黑屏。字幕:守艺,还是送死？"
    performance: >
      独坐——不是崩溃,是"空"。看木牌视线不聚焦。拿起针——习惯性动作。手停半空——意识到自己在做
      但不知道为什么还要做。放回针。全程剪影/暗部,不切面部。
    lighting: >
      窗外街灯冷蓝~6000K。唯一光源。从南窗斜入。光照亮木牌(画面中央),林素琴在暗处。
      光比极高——暗部极暗。谷崎润一郎"阴翳"美学核心段落。
    camera: >
      镜1: 中全景 林素琴+木牌 (50mm,绣架北侧固定,绣架边缘遮挡1/3画面)
      镜2: 极近特写 手拿针→停半空→放回 (微距)
      镜3: 停足2-4秒后→极缓推至近景→切黑屏。字幕2秒后出现。
    blocking: >
      林素琴在画面左侧暗处。木牌在中央被冷光照亮。丝线架在暗处(色彩消失)。
    sound: >
      极静。呼吸声——极慢。远处偶尔车声。老木梁微响。针放回桌:微"叮"。
      5秒沉默后黑屏(SR5)。字幕时:绣坊空环境声延续。无音乐。
    dialogue: "无对白"
    duration_sec: 12
    beat_type: "aftermath"
    style_notes: >
      全片最安静场。空间吞噬人。冷光只照亮木牌不照人——"权威还在,人空了"。
      AI: 低照度场景加"low light, single street lamp source, deep shadows, ISO-like subtle grain"。
    continuity_from: "E1_S03: 同一空间。手机还在桌上。微乱(未清理)。"
    continuity_to: "E1_S05: 同一夜更深,绣儿回来。光从冷蓝→暖黄。声桥:窗外冷风声持续。"
    visual_anchors:
      - "lin-suqin: 暗处剪影/衣襟微敞"
      - "wooden-sign: 冷光照亮木牌"
    ai_notes: "AI低照度场景:显式约束'only light source is distant streetlamp, no fill light, no rim light'。"
    negative_prompt: "林素琴哭。面部特写。配乐。暖光。整洁空间。"

  # ============================================================
  # Episode 2: 《福袋·崩裂》
  # ============================================================

  # --- 场4: 深夜·福袋递出 (3镜) ---
  - shot_id: "E1_S05"
    scene_id: "SC04_WORKSHOP_MIDNIGHT"
    character: "林素琴, 绣儿"
    location: "INT. 老绣坊 - 深夜"
    plot: "暖黄台灯。绣儿坐地上,脸有红印。拿出旧福袋。'这是外婆最后一针。'林素琴没有接。'别死守,要传下去。'"
    performance: >
      绣儿:坐地上(放低姿态)。拿出福袋时手指在边缘摩挲了一下才递。声音轻但稳——不是"求",是"传"。
      林素琴:没接。手在膝盖上微动——没抬起来。呼吸变慢。不是拒绝,是没准备好。
    lighting: >
      绣架台灯~2800K暖黄。唯一光源。光区极小——只照亮两双手和福袋,光圈外全暗。
      福袋磨损边缘在暖光中——暗红绸缎质感。
    camera: >
      镜1: 单人 绣儿坐地上,脸上红印可见 (50mm,固定,机高降至50cm地板视线)
      镜2: 极近特写 福袋从口袋拿出+边缘磨损+手指摩挲 (微距,焦点在福袋)
      镜3: 特写 林素琴的手在膝盖上,没接。悬着。(50mm,固定)
      不拍二人同框。不拍林素琴面部。
    blocking: >
      镜2: 福袋在画面中央。镜3: 林素琴的手+膝盖,福袋在画面外(她手没抬到的地方)。
    sound: >
      福袋拿出:绸缎微"沙"。手指摩挲边缘:细微摩擦。"这是外婆最后一针"后3秒沉默(SR5)。
      台灯低频嗡鸣。窗外极轻拆迁声(持续)。丝线滑过手指声。无音乐。
    dialogue: >
      绣儿(轻,稳):"这是外婆最后一针。她说——'别死守,要传下去。'"
    duration_sec: 14
    beat_type: "revelation"
    style_notes: >
      温暖≠和解。没接福袋>"立刻感动"真实。手在膝盖上微动=是枝裕和式细节。
      AI: 单人镜头交叉剪+物件特写。福袋提示:"worn dark red silk, frayed edges, soft texture from years of handling"。
    continuity_from: "E1_S04→E1_S05: 声桥——窗外冷风声混入台灯低频嗡鸣(冷→暖过渡)。绣儿右脸红印(场2巴掌)。"
    continuity_to: "E1_S06: 闪回声桥——'要传下去'余音中,外婆针线声提前0.5s进入(J-cut)。"
    visual_anchors:
      - "xiuer: 坐地上/脸有红印/放低姿态"
      - "lin-suqin: 手在膝盖上微动/不接"
      - "fu-dai: 暗红绸缎/边缘磨损/手掌大小"
    ai_notes: "手-物交互规避: 不拍传递过程,只拍'拿出'(单人)和'不接'(手悬空)。福袋质感显式提示。"
    negative_prompt: "林素琴立刻接福袋。拥抱。大哭。配乐。日式护身符样式。二人同框。"

  # --- 场5: 闪回·外婆 (2镜) ---
  - shot_id: "E1_S06"
    scene_id: "SC05_FLASHBACK"
    character: "外婆, 小绣儿"
    location: "INT. 旧屋 - 夜(闪回)"
    plot: "油灯。外婆在绣。小绣儿趴在旁边。外婆(笑着):'蜀绣,是一代传一代的。'"
    performance: >
      外婆:一边绣一边笑着说——不是"教训",在"日常中随口说"。手不停。小绣儿:趴着看外婆的手——不是"学",是小孩看着有趣的东西。
      全镜不切外婆面部特写——拍手+绣架+小绣儿的侧脸。
    lighting: >
      油灯~2200K极暖金。全片色温最低。光比极大——外婆面部+手在光中,背景全黑。
      油灯光有微颤(flicker)。记忆的光≠物理的光。
    camera: >
      镜1: 中景 外婆+绣架+小绣儿 (35mm,固定,机高60cm小绣儿视线高度)
      镜2: 近景 外婆手在绣 (50mm,固定)——外婆手部质感比林素琴更老但更稳
    blocking: >
