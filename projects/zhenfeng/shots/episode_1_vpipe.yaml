  # --- 场10: 重新落针 (3镜) ---
  - shot_id: "E1_S11"
    scene_id: "SC10_WORKSHOP_RETURN"
    character: "林素琴"
    location: "INT. 老绣坊 - 清晨"
    plot: "林素琴站着。看木牌→看福袋→看儿女。坐下。拿起针——手还在抖。闭眼,呼一口气。落针——稳了。"
    performance: >
      看木牌——和场3一样看但眼神不同("重新面对")。看福袋——在桌上(看到了,不需要拿起来)。
      坐下——与场1完全相同坐姿。手还在抖——不是不怕了,是不怕抖了。闭眼+深吸——然后落针稳。
      不微笑。不流泪。"稳了"靠动作:针走直了。
    lighting: >
      左窗天光~4500K——与场1同光源但色温略暖。同一构图,不同光线,不同手。"从歪到稳"的视觉回文。
    camera: >
      镜1: 中景 她站着看三个方向 (50mm,固定)——眼神方向:木牌→桌面→儿女
      镜2: 坐下完整动作 (50mm,固定,3-4秒不剪)——同场1的机位+角度+构图(视觉callback)
      镜3: 极近特写 针入布——稳了 (微距,同场1镜5机位)——frame-linking用场1最后一帧作参考
      全场固定。镜像场1的构图。
    blocking: >
      同场1: 绣架中央偏左,坐姿,左窗光,木牌在后,丝线架在北。"同一个位置,同一人,不同故事。"
    sound: >
      针入布:"沙"——稳而匀。丝线拉紧:微"呲"——均匀。呼吸声——呼吸和针线节奏同步(心率稳了)。
      窗外拆迁声:还在,但第一次——没有打断。她继续绣。无音乐。
    dialogue: "无对白"
    duration_sec: 12
    beat_type: "decision"
    style_notes: >
      场1"歪"↔场10"稳"=全片的针线弧线闭合。同机位同角度同构图——光线+手的稳度不同=叙事完成。
      AI回文结构: frame-linking用场1最后一帧作场10参考图,同prompt方向仅"hand steady"vs"slightly trembling"。
    continuity_from: "E1_S11与E1_S01: 同机位同角度——视觉callback。frame-linking应用。"
    continuity_to: "E1_S12: 蒙太奇——视频发布→传播→小女孩。声桥:针线声变形成数字点赞节奏。"
    visual_anchors:
      - "lin-suqin: 干净衣服/头发重新盘好/坐姿同场1"
      - "needle: 针稳=重生"
      - "fu-dai: 桌上——被看见但不用拿起来"
    ai_notes: >
      AI回文结构最优场景: frame-linking用场1最后一帧。同prompt仅改手状态:
      场1→"hand steady→slightly trembles",场10→"slight tremor→steadies, needle enters fabric cleanly"。
    negative_prompt: "微笑。流泪。与场1不同的机位(必须一致)。配乐。"

  # --- 场11: 蒙太奇·有人来 (4镜) ---
