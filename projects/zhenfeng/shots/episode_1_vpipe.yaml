  # --- 场7: AIGC动画·《蜀绣千年》 (6段流动画面) ---
  - shot_id: "E1_S08"
    scene_id: "SC07_AIGC_SEQUENCE"
    character: "— (影像流动)"
    location: "INT. 屏幕中的虚拟空间"
    plot: >
      骨针穿布(商周)→汉代织锦→唐宫绣衣→宋代写意→明清绣坊。
      外婆的手→林素琴的手→小伟数字线条重构→绣儿点击发布。最终停在外婆未完成的绣样——AI补全。
    performance: >
      无人物表演。"手"是唯一出现的人体——三代人的手以同一"捏针手势"连接(手指姿势一致)。
      手的演变=传承的演变。
    lighting: >
      色彩流动:暖土(远古)→金红(盛世)→冷蓝(数字化)→暖金(AI补全)。
      整体亮度:像暗室投影。AI补全瞬间:暖金慢慢浮现——绣样在呼吸。
    camera: >
      画面内部流动主导,摄影机运动是伴随性的——漂浮,不超前。
      景别:微距(针尖)→宏大全景(蜀绣历史长卷)→微距(AI补全最后一针)。
      每段5秒内,共6段。过渡:推入/淡入,不硬切。
    blocking: >
      纯视觉流动。三层次叠化:历史层(远古→当代)→手层(三代)→数字层(AI重构)。
      不是硬切——"一层浮现在另一层之上"。
    sound: >
      针线声变形为画面意象:骨针→石器摩擦,汉锦→织机木质冲击,唐绣→宫殿混响延时。
      真实锚点:持续远处拆迁声/风声贯穿全段。外婆的手入镜时:外婆针线声短暂回归。
      无配乐——声景即音乐。如必须用:古筝泛音或笛子单音,混入环境声不独立。
    dialogue: "无对白"
    duration_sec: 25
    beat_type: "reveal"
    style_notes: >
      AI绝对主场——风格化动画/抽象流动。不是"技术展示",是"一封家书"。
      三代人手捏针手势完全一致=核心视觉锚点。AI补全:安静,像一滴墨在水里散开。
    continuity_from: "E1_S07→E1_S08: 声桥——电子嗡鸣→变形为动画第一个声音(骨针摩擦)。"
    continuity_to: "E1_S09: 动画结尾古筝泛音/风声延续2秒→针盒掉地的'叮'切断。"
    visual_anchors:
      - "grandmother: 手(与林素琴相似但更老)"
      - "lin-suqin: 手(56岁,茧)"
      - "shu-embroidery-craft: 商周→汉→唐→宋→明清蜀绣演变"
    ai_notes: >
      AI最强段落——风格化渲染。需锁定一个视觉风格贯穿全段,不跳跃。
      建议先出6张关键帧覆盖历史节点,再动态化。
    negative_prompt: "科幻特效,炫酷转场,爆炸粒子,太空风格。管弦配乐,史诗感。商业产品广告。"

  # --- 场8: 崩溃·觉醒 (6镜) ---
  - shot_id: "E1_S09"
    scene_id: "SC08_WORKSHOP_BREAKDOWN"
    character: "林素琴, 小伟"
    location: "INT. 老绣坊 - 深夜"
    plot: >
      影像结束。'好看。但那不是蜀绣。'转身要走。看到福袋——停住。针盒掉地——针散开。
      蹲下捡——手在抖——捡不起来。'我守了一辈子针……是不是……守错了……'
      小伟:'这幅,是外婆没绣完的。我用AI,把它补完了。'林素琴崩溃。'娘……我不会传……'
    performance: >
      林素琴:"好看"——真心+自我保护。"要走"=逃离不是冷漠。看到福袋停住=身体语言>台词。
      蹲下捡针=全片情感顶点。手抖,捡不起。不切脸哭。"娘"——比"妈"更亲更老,女儿在对母亲说话。
      小伟:轻声坦白——不是"炫耀技术",是"怕但必须说"。
    lighting: >
      台灯暖黄~2800K + 屏幕冷蓝(影像结束还亮着)。冷暖同时存在=内心撕裂。
      针散落:针在台灯光圈边缘暗处反光。蹲下时脸进入光区——眼泪映光。
    camera: >
      镜1: 中景 林素琴看屏幕 (50mm,固定,不切特写)
      镜2: 中景 她说"好看"→转身 (50mm,固定)
      镜3: 中景 经过桌子,看到福袋,停住 (50mm,只拍脚停+桌面福袋,不拍脸)
      镜4: 特写 针盒掉地,针散开——只拍地面(微距俯拍,盒子+散针+台灯倒影)
      镜5: 中全景 她蹲下捡,手在抖——只拍地面+手(保持中全景不推近。DH1严格执行)
      镜6: 近景 抬头崩溃"娘……我不会传……"(50mm,固定,只拍面部到肩膀)
      全场不推近。不俯拍蹲下。不跟动作。
    blocking: >
      镜4: 针散落地面——集中在一个区域,有几根滚到绣架腿边(物理可信度)。镜5: 手入画→尝试抓→失败。
    sound: >
      影像结束:电子音渐收。3秒沉默。"好看"——轻轻,被台灯微嗡覆盖(SR2)。
      针盒掉地:"叮"——全片最刺耳单声。针散开:细碎金属滚动。蹲下捡针:手指砖地摩擦+针碰撞+哽住呼吸。
      "娘……我不会传……"说完后5秒沉默(SR5)。小伟"补完了"后留5秒纯环境声。无音乐(SR1)。
    dialogue: >
      林素琴:"好看。但那不是蜀绣。"
      林素琴(哽住):"我守了一辈子针……是不是……守错了……"
      小伟(轻声):"这幅,是外婆没绣完的。我用AI,把它补完了。"
      林素琴(哭,极轻):"娘……我不会传……"
    duration_sec: 30
    beat_type: "disaster"
    style_notes: >
      全片情感最高点。是枝裕和式:不喊叫/不推近/不配乐/不特写泪脸。崩溃=蹲在地上捡不起针。
      AI最大挑战: 针散落不拍掉落过程(拍结果)——"needles scattered on old brick floor, various angles"。
      手捡不起:5秒模块,极近特写针在指尖旁晃过但抓不住。眼泪用"tears in eyes, breath stutters"不直接用"crying"。
    continuity_from: "E1_S08→E1_S09: 动画风声延续2秒→被'叮'切断。福袋在桌上(场4绣儿放的)。"
    continuity_to: "E1_S10: 新一天。针已捡起放回。声桥:崩溃哭声余韵渐隐→清晨空气声渐起。"
    visual_anchors:
      - "lin-suqin: 摸耳垂/崩溃/头发散/眼红但不嚎啕"
      - "needle: 针盒打翻/针散落=崩溃"
      - "fu-dai: 在桌上——看到后停住"
    ai_notes: >
      全片AI最挑战场。策略: 不拍针盒掉落过程(多体物理)→只拍结果散落地面的针(微距)。
      手捡针=手-物交互弱项→极近特写针尖在指尖边晃过但抓不住,5秒切段。
      崩溃不拍脸哭→近景保持50cm距离,生理提示"tears in eyes, breath stutters, shoulders tremble slightly"。
    negative_prompt: >
      嚎啕大哭。特写泪脸。针盒掉落过程(AI多体物理崩溃)。捡针成功。配乐推情绪。
      theatrical crying, open mouth sobbing, exaggerated shaking, cartoonish emotions.

